name: callifex
description: Personalized, project-based career learning demo.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  firebase_ai: ^4.0.0
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/learning_paths.json
    - assets/data/images/main-logo.svg
